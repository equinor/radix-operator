spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  automountServiceAccountToken: false
  containers:
    - args:
        - -c
        - echo 'start'; while true; do echo $(date);sleep 3600; done; echo 'exit'
      command:
        - sh
      image: docker.io/bash:latest
      imagePullPolicy: Always
      name: aux
      resources:
        limits:
          memory: 20M
        requests:
          cpu: 1m
          memory: 20M
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
