# Default values for radix-operator.
nameOverride: ""
fullnameOverride: ""

# Radix common configuration rendered into the "radix-common-config" ConfigMap
# and consumed by the operator at startup.
config:
  common:
    dnsZone: ""
    clusterName: ""
    oauth2Proxy:
      proxyImage:
        repository: quay.io/oauth2-proxy/oauth2-proxy
        tag: latest
      redisImage:
        repository: docker.io/redis
        tag: latest
      proxyDefaults:
        scope: "openid profile email"
        proxyPrefix: "/oauth2"
        setXAuthRequestHeaders: false
        setAuthorizationHeader: false
        sessionStoreType: cookie # Do not override default sessionStoreType since this is currently not supported by api-server, ref https://github.com/equinor/radix-operator/issues/1949
        cookie:
          name: "_oauth2_proxy"
          expire: "168h0m0s"
          refresh: "60m0s"
          sameSite: "lax"
        # oidc:
        #   issuerUrl: "https://issuer.com"
        #   skipDiscovery: false
  operator:
    logLevel: info
    logPrettyPrint: false
    registrationControllerThreads: 1
    applicationControllerThreads: 1
    environmentControllerThreads: 1
    deploymentControllerThreads: 1
    jobControllerThreads: 1
    alertControllerThreads: 1
    kubeClientRateLimitBurst: 5
    kubeClientRateLimitQPS: 5
    readinessProbeInitialDelaySeconds: 5
    readinessProbePeriodSeconds: 10

    defaultRollingUpdateMaxUnavailable: 25%
    defaultRollingUpdateMaxSurge: 25%

    clusterType: ""

    containerRegistry: ""
    appContainerRegistry: ""
    appAliasBaseURL: app.dev.radix.equinor.com

    kubernetesAPIPort: "$__env(KUBERNETES_SERVICE_PORT)"

    defaultAppAdminGroups: []

    # Ref https://kubernetes.io/docs/concepts/security/pod-security-standards/ for docs and valid values for level and version
    podSecurityStandard:
      appNamespace:
        enforce:
          level: "privileged"
          version: "latest"
        audit:
          level: ""
          version: ""
        warn:
          level: ""
          version: ""
      envNamespace:
        enforce:
          level: "baseline"
          version: "latest"
        audit:
          level: ""
          version: ""
        warn:
          level: ""
          version: ""

    appNsLimitRange:
      defaultMemory: 450M
      defaultRequestMemory: 450M
      defaultRequestCPU: 100m

    envNsLimitRange:
      defaultMemory: 500M
      defaultRequestMemory: 500M
      defaultRequestCPU: 100m

    builder:
      image:
        repository: ghcr.io/equinor/radix/buildkit-builder
        tag: "latest"
      seccompProfileLocalhostProfile: ""
      resources:
        limits:
          memory: 500M
          cpu: 2000m
        requests:
          memory: 500M
          cpu: 200m

    jobSchedulerImage:
      repository: ghcr.io/equinor/radix/job-scheduler
      tag: "" # Fallback to .Chart.Version

    batchSafeToRestartJobThreshold: 259200

    externalRegistryAuthSecret: "" # Name of the secret containing default container registry credentials for pulling images when building with buildah and pulling external images for components and jobs
    azureKeyVaultTenantID: "" # Tenant ID for Azure Key Vault used for secrets in Radix applications

    jobSchedulerAuxImage:
      repository: docker.io/bash
      tag: "latest"
    deploymentHistoryLimit: 10

    gateway:
      name: ""
      namespace: ""
      sectionName: "https"

    certificateAutomation:
      duration: "2160h"
      renewBefore: "720h"
      gatewayClusterIssuer: ""
    orphanedEnvironmentsRetentionPeriod: 720h
    orphanedEnvironmentsCleanupCron: "0 0 * * *"

    pipelineJobsHistoryLimit: 5
    pipelineJobsHistoryPeriodLimit: "720h"
    gitCloneImage:
      repository: docker.io/alpine/git
      tag: "latest"
    pipelineImage:
      repository: "ghcr.io/equinor/radix/pipeline"
      tag: "" # Fallback to .Chart.Version
    pipelineImagePullPolicy: "Always"

replicaCount: 1

image:
  repository: ghcr.io/equinor/radix/operator
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullPolicy: Always
  pullSecrets: [] # List of image pull secret names to use for the radix-operator image

service:
  # annotations: {}
  type: ClusterIP
  internalPort: 9000

serviceAccount:
  # The name of the service account to use.
  # If not set, a name is generated using the fullname template
  name: ""

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 1Gi

nodeSelector: {}

tolerations: []

affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  supplementalGroups:
    - 1000

securityContext:
  privileged: false
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# Additional volumes to add to the radix-cost-allocation pod.
volumes: []

# Additional volume mounts to add to the radix-cost-allocation container.
volumeMounts: []

rbac:
  createApp:
    groups: [] # List of groups with permission to create new RadixRegistation

seccompProfile:
  fileNameOnNode: allow-buildah.json
  image:
    tag: "3.20"
    repository: docker.io/alpine
    pullSecrets: [] # List of secret names to use
  installer:
    configMapName: "seccomp-allow-buildah"
    daemonSetName: copy-seccomp-profile
    resources:
      limits:
        cpu: 10m
        memory: 10Mi
      requests:
        cpu: 10m
        memory: 10Mi

radixApiServer:
  useProfiler: false
  logLevel: info
  logPretty: false
  prometheusUrl: ""
  oidcAzureAudience: ""
  oidcAzureIssuer: ""
  oidcKubernetesIssuer: ""
  oidcKubernetesAudience: ""
  clusterOidcIssuers: ""
  clusterEgressIps: ""

  image:
    repository: ghcr.io/equinor/radix/api-server
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    pullSecrets: [] # List of image pull secret names to use for the radix-api-server image

  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

  nodeSelector: {}

  tolerations: []

  affinity: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  securityContext:
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  serviceMonitor:
    enabled: true
    interval: 5s

  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    # maxUnavailable: 1

  networkPolicy:
    enabled: true
    ingress:
      from: []
        # - namespaceSelector:
        #     matchLabels:
        #       purpose: ingress
        #   podSelector:
        #     matchLabels:
        #       gateway.networking.k8s.io/gateway-name: gateway

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
    # behavior:
    #   scaleDown:
    #     stabilizationWindowSeconds: 300
    #     policies:
    #       - type: Percent
    #         value: 10
    #         periodSeconds: 60
    #   scaleUp:
    #     stabilizationWindowSeconds: 0
    #     policies:
    #       - type: Percent
    #         value: 100
    #         periodSeconds: 15

  routes:
    main:
      enabled: true
      annotations: {}
      labels: {}
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway
          namespace: istio-system
          sectionName: https
      hostnames:
        - api.radix.equinor.com
      backendPort: 3002
      filters:
        - responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /

radixWebhook:
  logLevel: info
  logPretty: false
  requireAdGroups: true
  requireConfigurationItem: true

  reservedAppDNSAliases:
    api: radix-api
    canary: radix-canary-golang
    console: radix-web-console
    cost-api: radix-cost-allocation-api

  reservedDNSAliases:
    - grafana
    - prometheus
    - www
    - app
    - playground
    - dev

  image:
    repository: ghcr.io/equinor/radix/webhook
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets: [] # List of image pull secret names to use for the webhook image

  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      cpu: 100m
      memory: 100Mi

  nodeSelector: {}

  tolerations: []

  affinity: {}

  # Extra pod labels
  podLabels: {}
  # Annotations to add to the pod

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  securityContext:
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
