apiVersion: apps/v1
kind: Deployment
metadata:
  name: radix-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radix-webhook.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "radix-webhook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "radix-webhook.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: radix-webhook

      {{- with .Values.radixWebhook.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.radixWebhook.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.radixWebhook.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.radixWebhook.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.radixWebhook.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.radixWebhook.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}

      volumes:
        - name: certs
          secret:
            secretName: {{ .Values.config.webhook.secretName }}
            
      containers:
        - name: radix-webhook
          image: {{ .Values.radixWebhook.image.repository }}:{{ .Values.radixWebhook.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.radixWebhook.imagePullPolicy | default "IfNotPresent" }}

          {{- with .Values.radixWebhook.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.radixWebhook.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          ports:
            - containerPort: 9443
              name: webhook
            - containerPort: 9440
              name: healthz
            - containerPort: 9000
              name: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
          livenessProbe:
            httpGet: 
              path: /healthz
              port: healthz
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RADIX_COMMON_CONFIG_NAME
              value: {{ include "radix-common-config.name" . }}
            - name: RADIX_COMMON_CONFIG_KEY
              value: "configYaml"
          volumeMounts:
            - name: certs
              mountPath: {{ .Values.config.webhook.certsDir}}
              readOnly: true
