nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/equinor/radix/easyauth
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: [] # List of image pull secret names

serviceAccount:
  # The name of the service account to use. Defaults to the fullname template.
  name: ""
  annotations: {}

# Rendered into the release specific radix common config ConfigMap and parsed by easyauth (see easyauth/config.go).
config:
  # When true, applying a RadixApplication without requiredAnnotation is rejected by the validating webhook
  enforced: false
  annotation: radix.equinor.com/easyauth
  issuerUrl: https://simpleauth.dev.radix.equinor.com
  enableLeaderElection: true
  # Lease name used for leader election. Must be unique per release within the namespace.
  # Defaults to <fullname>.easyauth.radix.equinor.com
  leaderId: ""
  logLevel: info
  logPrettyPrint: false
  port: 9443
  metricsPort: 9000
  healthPort: 9440
  # Mount path for the cert-manager generated webhook serving certificate
  certsDir: /run/certs

webhook:
  failurePolicy: Fail
  timeoutSeconds: 10
  # Namespaces where RadixApplications are not mutated or validated
  excludedNamespaces:
    - kube-system

certificate:
  # Duration and renewal window for the webhook serving certificate
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  ca:
    # Duration and renewal window for the self-signed CA certificate
    duration: 87600h # 10 years
    renewBefore: 720h # 30 days
    commonName: radix-easyauth-ca
    organization: Radix EasyAuth CA

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Dex OIDC provider used by EasyAuth, see easyauth/README.md.
# The Dex issuer is config.issuerUrl, which is also the issuer set on all public components by the mutating webhook.
dex:
  enabled: false
  replicaCount: 2

  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.46.0
    pullPolicy: IfNotPresent

  # Postgres database where Dex stores clients, keys and sessions
  storage:
    postgres:
      host: ""
      port: 5432
      database: dex
      user: dex
      # Existing Secret with the database password
      passwordSecret:
        name: ""
        key: password
      ssl:
        # disable, require, verify-ca or verify-full
        mode: verify-full

  # Free-form Dex configuration, for example connectors, oauth2, expiry and frontend.
  # See https://github.com/dexidp/dex/blob/master/examples/config-dev.yaml
  # issuer, storage, web, grpc and telemetry are set by the chart and can't be overridden here.
  # Environment variables, for example from extraEnv, can be referenced as $VAR.
  config: {}

  # Additional environment variables, for example connector client secrets referenced from config
  extraEnv: []
  # - name: ENTRA_CLIENT_SECRET
  #   valueFrom:
  #     secretKeyRef:
  #       name: dex-entra
  #       key: clientSecret

  httpRoute:
    enabled: true
    # Gateways or ListenerSets the Dex HTTPRoute is attached to. The hostname and path are taken from config.issuerUrl.
    parentRefs: []
    # - group: gateway.networking.k8s.io
    #   kind: Gateway
    #   name: gateway
    #   namespace: istio-system
    #   sectionName: https
    # - group: gateway.networking.k8s.io
    #   kind: ListenerSet
    #   name: easyauth
    #   namespace: radix-easyauth
    annotations: {}

  # Restricts the gRPC API to the EasyAuth pods. The HTTP and telemetry ports are open to all.
  networkPolicy:
    enabled: true

  certificate:
    # Duration and renewal window for the gRPC server and EasyAuth client certificates
    duration: 2160h # 90 days
    renewBefore: 360h # 15 days

  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
