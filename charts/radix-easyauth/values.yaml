nameOverride: ""
# Truncated to 47 characters, to leave room for the suffixes of derived resource names
fullnameOverride: ""

# The webhooks are served by every replica, the controller only runs on the leader.
# With webhook.failurePolicy Fail, at least two replicas are needed to keep RadixApplications writable during
# restarts, node drains and crashes.
replicaCount: 2

# Created when replicaCount is greater than 1
podDisruptionBudget:
  minAvailable: 1

image:
  repository: ghcr.io/equinor/radix/easyauth
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: [] # List of image pull secret names

serviceAccount:
  # The name of the service account to use. Defaults to the fullname template.
  name: ""
  annotations: {}

# Rendered into the release specific radix common config ConfigMap and parsed by easyauth (see easyauth/config.go).
config:
  # When true, applying a RadixApplication without the easyauth.radix.equinor.com annotation is rejected by the
  # validating webhook
  enforced: false
  # Required. The Dex issuer, set on all public components by the mutating webhook. Overrides dex.config.issuer and config.oauth2.oidc.issuerUrl
  issuerUrl: "" # for example https://easyauth.dev.radix.equinor.com
  # OAuth2 configuration set on all public components, see authentication.oauth2 in the radixconfig.yaml
  # documentation for all settings. clientId, credentials and oidc.issuerUrl are set by EasyAuth and must not be set.
  oauth2:
    # Default groups when the easyauth.radix.equinor.com/allowed-identities annotation is missing or empty. The
    # annotation replaces this list.
    # If both are empty, RadixApplications with the EasyAuth annotation are rejected.
    # Groups must be in the configured group claim of the ID token from Dex.
    allowedGroups: []
    # - group-a
    # - group-b
    scope: openid profile email groups offline_access
    setAuthorizationHeader: false # Should be false to avoid abuse of token
    setXAuthRequestHeaders: false # Should be false to avoid abuse of token
    setUserHeaders: true
    sessionStoreType: systemManaged
  # Required. Must match config.common.clusterName, dnsZone and appAliasBaseURL of radix-operator in the same cluster,
  # since they are used to build the OAuth2 redirect URIs of the public hosts of each application
  clusterName: ""
  dnsZone: ""
  appAliasBaseURL: ""
  # Must be true when replicaCount is greater than 1
  enableLeaderElection: true
  # Lease name used for leader election. Must be unique per release within the namespace.
  # Defaults to <fullname>.easyauth.radix.equinor.com
  leaderId: ""
  logLevel: info
  logPrettyPrint: false
  port: 9443
  metricsPort: 9000
  healthPort: 9440
  # Mount path for the cert-manager generated webhook serving certificate
  certsDir: /run/certs
  # Deletes Dex clients that no longer belong to an application. Set to false in all but one of the clusters
  # sharing the Dex database, see easyauth/README.md. Always false with Dex Kubernetes storage.
  cleanupEnabled: true
  cleanupInterval: 1h
  # How old an OAuth2 client secret can be before it is rotated, at least 1h. Must be the same in all clusters
  # sharing the Dex database. Use a short interval, for example 24h, in dev to exercise rotation often.
  secretRotationInterval: 2160h # 90 days
  maxConcurrentReconciles: 1

# Prometheus Operator ServiceMonitor that scrapes the metrics port (config.metricsPort) of the EasyAuth pods.
# The metrics port is always exposed on the webhook Service, for other collectors.
# Requires the monitoring.coreos.com/v1 ServiceMonitor CRD.
serviceMonitor:
  enabled: false
  # Scrape interval, defaults to the Prometheus global scrape interval when empty
  interval: ""
  # Additional labels on the ServiceMonitor, for example to match the serviceMonitorSelector of Prometheus
  labels: {}

webhook:
  failurePolicy: Fail
  timeoutSeconds: 10

certificate:
  # Duration and renewal window for the webhook serving certificate
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  ca:
    # Duration and renewal window for the self-signed CA certificate
    duration: 87600h # 10 years
    renewBefore: 720h # 30 days
    commonName: radix-easyauth-ca
    organization: Radix EasyAuth CA

# The controller caches RadixApplications, RadixDeployments and OAuth2 proxy Secrets, which grows with the number of
# applications. An OOM kill also takes down the webhooks, so leave headroom.
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
# Defaults to a preferred pod anti-affinity that spreads replicas across nodes
affinity: {}
podAnnotations: {}
podLabels: {}

# Dex OIDC provider used by EasyAuth, see easyauth/README.md. Required, EasyAuth stores OAuth2 clients in Dex.
# The Dex issuer is config.issuerUrl, which is also the issuer set on all public components by the mutating webhook.
dex:
  replicaCount: 2

  image:
    repository: ghcr.io/dexidp/dex
    tag: latest
    pullPolicy: IfNotPresent

  # Dex configuration, merged with these defaults. See https://github.com/dexidp/dex/blob/master/examples/config-dev.yaml
  # for all settings. issuer (from config.issuerUrl), grpc, telemetry and web.http are set by the chart and can't be
  # overridden here. Other web settings are merged with the chart's.
  # Environment variables, for example from extraEnv, can be referenced as $VAR.
  config:
    # Where Dex stores clients, keys and sessions. Required, see https://dexidp.io/docs/configuration/storage/.
    # With type kubernetes, Dex gets access to its custom resources and CRDs, and config.cleanupEnabled is always
    # false, since Dex can't list clients in Kubernetes storage.
    storage: {}
    # type: postgres
    # config:
    #   host: postgres.example.com
    #   port: 5432
    #   database: dex
    #   user: dex
    #   password: $DEX_POSTGRES_PASSWORD
    #   ssl:
    #     mode: verify-full
    logger:
      # debug, info, warn or error
      level: info
      # json or text
      format: json

    oauth2:
      skipApprovalScreen: true

  # Additional environment variables, for example storage passwords or connector client secrets referenced from config
  extraEnv: []
  # - name: DEX_POSTGRES_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: dex-postgres
  #       key: password
  # - name: ENTRA_CLIENT_SECRET
  #   valueFrom:
  #     secretKeyRef:
  #       name: dex-entra
  #       key: clientSecret

  # Additional volumes for the Dex pod, for example a shared emptyDir written by a sidecar
  extraVolumes: []
  # - name: pgpass
  #   emptyDir:
  #     medium: Memory

  # Additional volume mounts for the Dex container
  extraVolumeMounts: []
  # - name: pgpass
  #   mountPath: /var/run/pgpass
  #   readOnly: true

  # Init containers for the Dex pod. Use restartPolicy: Always for a native sidecar that starts before Dex and keeps
  # running, for example to refresh a database token in a file read by Dex. Templated with tpl.
  initContainers: []
  # - name: pgpass
  #   image: example.com/pgpass-refresher:1.0.0
  #   restartPolicy: Always
  #   volumeMounts:
  #     - name: pgpass
  #       mountPath: /var/run/pgpass
  #   startupProbe:
  #     exec:
  #       command: [test, -s, /var/run/pgpass/pgpass]

  # Additional containers in the Dex pod. Templated with tpl.
  extraContainers: []

  httpRoute:
    enabled: true
    # Gateways or ListenerSets the Dex HTTPRoute is attached to. The hostname and path are taken from config.issuerUrl.
    parentRefs: []
    # - group: gateway.networking.k8s.io
    #   kind: Gateway
    #   name: gateway
    #   namespace: istio-system
    #   sectionName: https
    # - group: gateway.networking.k8s.io
    #   kind: ListenerSet
    #   name: easyauth
    #   namespace: radix-easyauth
    annotations: {}

  # Restricts the gRPC API to the EasyAuth pods. The HTTP and telemetry ports are open to all.
  networkPolicy:
    enabled: true

  # Prometheus Operator ServiceMonitor that scrapes the telemetry port (5558) of the Dex pods.
  # The telemetry port is always exposed on the Dex Service, for other collectors.
  # Requires the monitoring.coreos.com/v1 ServiceMonitor CRD.
  serviceMonitor:
    enabled: false
    # Scrape interval, defaults to the Prometheus global scrape interval when empty
    interval: ""
    # Additional labels on the ServiceMonitor, for example to match the serviceMonitorSelector of Prometheus
    labels: {}

  # Mounts the service account token in the Dex pods. Always true with Kubernetes storage.
  # Not required by Azure Workload Identity, which projects its own token.
  automountServiceAccountToken: false

  serviceAccount:
    # For Azure Workload Identity, set azure.workload.identity/client-id and add the label
    # azure.workload.identity/use: "true" to dex.podLabels
    annotations: {}
    labels: {}

  certificate:
    # Duration and renewal window for the gRPC server and EasyAuth client certificates
    duration: 2160h # 90 days
    renewBefore: 360h # 15 days

  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
