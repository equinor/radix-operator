apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radix-easyauth.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radix-easyauth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "radix-easyauth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/radix-common-config: {{ include (print $.Template.BasePath "/radix-common-config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "radix-easyauth.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "radix-easyauth.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      volumes:
        - name: webhook-certs
          secret:
            # Populated by cert-manager
            secretName: {{ include "radix-easyauth.servingCertificateSecretName" . }}
        {{- if .Values.dex.enabled }}
        - name: dex-client-certs
          secret:
            # Populated by cert-manager
            secretName: {{ include "radix-easyauth.dex.grpcClientCertificateSecretName" . }}
        {{- end }}
      containers:
        - name: easyauth
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RADIX_COMMON_CONFIG_NAME
              value: {{ include "radix-easyauth.commonConfigName" . }}
            - name: RADIX_COMMON_CONFIG_KEY
              value: {{ include "radix-easyauth.commonConfigKey" . }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.config.port }}
              name: webhook
              protocol: TCP
            - containerPort: {{ .Values.config.healthPort }}
              name: healthz
              protocol: TCP
            - containerPort: {{ .Values.config.metricsPort }}
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
          volumeMounts:
            - name: webhook-certs
              mountPath: {{ .Values.config.certsDir }}
              readOnly: true
            {{- if .Values.dex.enabled }}
            - name: dex-client-certs
              mountPath: {{ include "radix-easyauth.dex.clientCertsDir" . }}
              readOnly: true
            {{- end }}
