apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "radix-easyauth.clusterScopedName" . }}-radixapplication
  labels:
    {{- include "radix-easyauth.labels" . | nindent 4 }}
rules:
  - apiGroups: ["radix.equinor.com"]
    resources: ["radixapplications", "radixregistrations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["radix.equinor.com"]
    resources: ["radixdeployments"]
    verbs: ["get", "list", "watch", "patch"]
  # The client secret from Dex is written to the OAuth2 proxy Secrets created by radix-operator
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "patch"]
  # Restarts the OAuth2 proxy when the client secret changes
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
