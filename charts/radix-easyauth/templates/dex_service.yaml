apiVersion: v1
kind: Service
metadata:
  name: {{ include "radix-easyauth.dex.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radix-easyauth.dex.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5556
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ include "radix-easyauth.dex.grpcPort" . }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 5558
      targetPort: telemetry
      protocol: TCP
      name: telemetry
  selector:
    {{- include "radix-easyauth.dex.selectorLabels" . | nindent 4 }}
---
# The token is only mounted in the Dex pods when Dex stores its data in Kubernetes, see dex_rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "radix-easyauth.dex.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radix-easyauth.dex.labels" . | nindent 4 }}
automountServiceAccountToken: false
