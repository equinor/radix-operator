{{- $_ := required "config.clusterName is required" .Values.config.clusterName -}}
{{- $_ := required "config.dnsZone is required" .Values.config.dnsZone -}}
{{- $_ := required "config.appAliasBaseURL is required" .Values.config.appAliasBaseURL -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "radix-easyauth.commonConfigName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "radix-easyauth.labels" . | nindent 4 }}
data:
  {{ include "radix-easyauth.commonConfigKey" . }}: |
    {{- $chartValues := dict
      "leaderId" (.Values.config.leaderId | default (printf "%s.easyauth.radix.equinor.com" (include "radix-easyauth.fullname" .)))
    -}}
    {{- $_ := set $chartValues "dex" (dict
      "grpcAddress" (include "radix-easyauth.dex.grpcAddress" .)
      "certsDir" (include "radix-easyauth.dex.clientCertsDir" .)
    ) }}
    {{- /* Dex doesn't implement ListClients for Kubernetes storage */ -}}
    {{- if include "radix-easyauth.dex.kubernetesStorage" . }}
    {{- $_ := set $chartValues "cleanupEnabled" false }}
    {{- end }}
    {{- mergeOverwrite (deepCopy .Values.config) $chartValues | toYaml | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "radix-easyauth.fullname" . }}-common-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radix-easyauth.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "radix-easyauth.commonConfigName" . | quote }}]
    verbs: ["get"]
