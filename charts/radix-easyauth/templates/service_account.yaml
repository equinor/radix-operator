apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "radix-easyauth.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radix-easyauth.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "radix-easyauth.fullname" . }}-common-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radix-easyauth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "radix-easyauth.fullname" . }}-common-config
subjects:
  - kind: ServiceAccount
    name: {{ include "radix-easyauth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "radix-easyauth.clusterScopedName" . }}-radixapplication
  labels:
    {{- include "radix-easyauth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "radix-easyauth.clusterScopedName" . }}-radixapplication
subjects:
  - kind: ServiceAccount
    name: {{ include "radix-easyauth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.config.enableLeaderElection }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "radix-easyauth.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radix-easyauth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "radix-easyauth.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "radix-easyauth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
