apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "radix-easyauth.clusterScopedName" . }}
  labels:
    {{- include "radix-easyauth.labels" . | nindent 4 }}
  annotations:
    # cert-manager cainjector populates clientConfig.caBundle from this Certificate
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "radix-easyauth.servingCertificateName" . }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "radix-easyauth.serviceName" . }}
      namespace: {{ .Release.Namespace }}
      path: /radix/v1/radixapplication/mutate
      port: 443
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  matchPolicy: Equivalent
  name: radixapplication.mutate.easyauth.radix.equinor.com
  reinvocationPolicy: IfNeeded
  rules:
  - apiGroups:
    - radix.equinor.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - radixapplications
    scope: Namespaced
  sideEffects: None
  timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "radix-easyauth.serviceName" . }}
      namespace: {{ .Release.Namespace }}
      path: /radix/v1/radixdeployment/mutate
      port: 443
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  matchPolicy: Equivalent
  name: radixdeployment.mutate.easyauth.radix.equinor.com
  reinvocationPolicy: IfNeeded
  rules:
  - apiGroups:
    - radix.equinor.com
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - radixdeployments
    scope: Namespaced
  sideEffects: None
  timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
