apiVersion: v1
kind: Service
metadata:
  name: {{ include "radix-easyauth.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radix-easyauth.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      targetPort: webhook
      protocol: TCP
      name: webhook
  selector:
    {{- include "radix-easyauth.selectorLabels" . | nindent 4 }}
