image:
  pullPolicy: IfNotPresent
  tag: "{{IMAGE_TAG}}"

config:
  logLevel: debug
  logPrettyPrint: true
  # The Dex Service, so the OAuth2 proxies in the cluster can reach the issuer without a gateway controller.
  # Must match easyAuthOAuth2IssuerURL in radix_easyauth_test.go
  issuerUrl: http://radix-easyauth-dex.radix-easyauth.svc:5556
  # Must match config.common in radix-operator-values.yaml
  clusterName: weekly-e2e
  dnsZone: radix.example.com
  appAliasBaseURL: app.example.com

# Dex uses the throwaway Postgres from testdata/dex-postgres.yaml
dex:
  replicaCount: 1
  extraEnv:
    - name: DEX_POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: dex-postgres
          key: password
  config:
    storage:
      type: postgres
      config:
        host: dex-postgres.radix-easyauth.svc
        port: 5432
        database: dex
        user: dex
        password: $DEX_POSTGRES_PASSWORD
        ssl:
          mode: disable
    # Static user for the login test in radix_easyauth_test.go. The hash is the bcrypt hash of easyAuthTestPassword.
    enablePasswordDB: true
    staticPasswords:
      - email: e2e-user@example.com
        hash: "$2a$10$Iq9ba6PxTcQcyDx8B18.LO80G/svq.NaAGYesqjYRsrw3nMY/phQy"
        username: e2e-user
        userID: faef31b9-22e5-41f0-9833-9f56397c1415
  httpRoute:
    # There is no gateway controller in the kind cluster, so the HTTPRoute is created but never accepted
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: e2e-gateway
        namespace: radix-easyauth
