# Throwaway Postgres used as Dex storage in the e2e tests. Not for production use.
apiVersion: v1
kind: Namespace
metadata:
  name: radix-easyauth
---
apiVersion: v1
kind: Secret
metadata:
  name: dex-postgres
  namespace: radix-easyauth
type: Opaque
stringData:
  password: e2e-dex-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex-postgres
  namespace: radix-easyauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex-postgres
  template:
    metadata:
      labels:
        app: dex-postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: dex
            - name: POSTGRES_DB
              value: dex
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dex-postgres
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dex", "-d", "dex"]
---
apiVersion: v1
kind: Service
metadata:
  name: dex-postgres
  namespace: radix-easyauth
spec:
  selector:
    app: dex-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
