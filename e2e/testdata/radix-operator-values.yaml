image:
  pullPolicy: IfNotPresent

rbac:
  createApp:
    groups:
      - "123"

config:
  common:
    appAliasBaseURL: app.example.com
    clusterName: weekly-e2e
    clusterType: test
    dnsZone: radix.example.com
    oauth2Proxy:
      proxyDefaults:
        oidc:
          # oauth2-proxy exits on startup without a discoverable issuer
          issuerUrl: https://login.microsoftonline.com/3aa4a235-b6e2-48d5-9195-7fcf05b459b0/v2.0

  pipelineRunner:
    containerRegistry: local-kind-repo
    cacheContainerRegistry: local-kind-repo

  operator:
    pipelineImage:
      repository: local-kind-repo/pipeline-runner
    pipelineImagePullPolicy: IfNotPresent
    jobSchedulerImage:
      repository: local-kind-repo/job-scheduler
    azureKeyVaultTenantID: 01234567-8901-2345-6789-012345678901
    gateway:
      name: some-name
      namespace: some-namespace
    certificateAutomation:
      gatewayClusterIssuer: some-cluster-issuer

  # Mirrors the radix-flux override; "{{ARCH}}" is replaced with the host architecture at install time.
  runtime:
    oauth2ProxyTemplate:
      base: null # Defaults to content in file ./files/oauth2-proxy-base.yaml
      overlay:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values:
                          - linux
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                          - "{{ARCH}}"
          containers:
            - name: proxy
              image: "quay.io/oauth2-proxy/oauth2-proxy:v7.15.4"

    oauth2SessionStoreTemplate:
      overlay:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values:
                          - linux
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                          - "{{ARCH}}"
          containers:
            - name: session-store
              image: docker.io/redis:7.4.2

  apiServer:
    logLevel: debug
    logPrettyPrint: true
    prometheusUrl: http://prometheus.svc
    authenticators:
      azure:
        issuer: https://sts.windows.net/3aa4a235-b6e2-48d5-9195-7fcf05b459b0/
        audience: 6dae42f8-4368-4678-94ff-3960e28e3630
