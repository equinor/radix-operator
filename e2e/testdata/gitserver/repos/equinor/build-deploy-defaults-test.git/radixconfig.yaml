# Used by TestBuildDeployStopsWhenRadixConfigIsUnchanged. The API server defaults
# environments[].build.webhookEnabled to true, so the applied RadixApplication differs from this file.
apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: build-deploy-defaults-test
spec:
  environments:
    - name: dev
      build:
        from: dev
  components:
    - name: web
      image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
      runtime:
        architecture: "{{ARCH}}"
      ports:
        - name: http
          port: 8080
