# The radixconfig after EasyAuth is activated, see radixconfig-before-easyauth.yaml
apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: easyauth-promote-test
  annotations:
    radix.equinor.com/easyauth: ""
spec:
  environments:
    - name: dev
    - name: prod
  components:
    - name: web
      image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
      runtime:
        architecture: "{{ARCH}}"
      ports:
        - name: http
          port: 8080
      publicPort: http
